 {place:'Córdoba',source:'Nunca Más · p. 11 · legajo 3860',pdfPage:11,context:'Una familia denunció un operativo nocturno en su vivienda. Vamos a reconstruir qué ocurrió desde el corte de luz hasta el destino de quienes fueron llevados.',dispatch:'Nos llamó una mujer de Villa Rivera Indarte, en Córdoba. Un grupo entró a su casa de noche y se llevó a varios integrantes de su familia. Andá a escucharla: sus destinos fueron distintos.',detail:'La declaración describe un operativo en una vivienda de Villa Rivera Indarte, iniciado cerca de las 00:30 después de un corte de luz. El saqueo se prolongó por más de dos horas. La mujer fue liberada al día siguiente; su hijo estuvo cautivo en Campo La Ribera y su marido apareció muerto.',turns:[
  [{q:'¿A qué hora empezó todo?',a:'A las 00:30 entraron a nuestra casa en Villa Rivera Indarte. Antes se había cortado la luz en las calles cercanas.'},{q:'¿La familia ya sabía que iban a llegar?',a:'No. Estábamos en casa. De pronto entraron uniformados con armas largas y jóvenes con ropa deportiva.'}],
  [{q:'¿Qué hicieron al entrar?',a:'Nos encañonaron y empezaron a sacar libros, objetos de arte y vinos. Los uniformados se los llevaban afuera.'},{q:'¿Cuánto duró el operativo?',a:'El saqueo duró más de dos horas. No hablaban entre ellos: se comunicaban con chasquidos.'}],
  [{q:'¿A quiénes se llevaron?',a:'Se llevaron a mi marido, a mi hijo David y a mí. Nos sacaron de nuestra casa.'},{q:'¿Qué pasó con la casa?',a:'Quedó totalmente destruida. El saqueo había durado más de dos horas.'}],

  updateProgress(82);const docChoices=[{id:'careful',text:'Usarla para proponer una hipótesis de regularidad y volver a cada caso para ver qué la confirma o limita.'},{id:'absolute',text:'Aplicar a cada caso el patrón que resume la CONADEP, aunque no todos sus detalles aparezcan en cada testimonio.'},{id:'dismiss',text:'Tomar primero la síntesis como panorama general y dejar los detalles de cada testigo para después.'}];html=`<p class="eyebrow">ARCHIVO · SÍNTESIS DE LA CONADEP</p><h1>${CONADEP_PAGE.title}</h1><article class="document-page"><div class="doc-kicker">INFORME · 1984</div><blockquote>${esc(CONADEP_PAGE.quote)}</blockquote><p>${esc(CONADEP_PAGE.body)}</p><small>${CONADEP_PAGE.source}</small></article><div class="mission-box"><strong>LEÉ Y TOMÁ UNA DECISIÓN</strong><p>¿Cómo usar esta síntesis junto con lo que contaron los testigos?</p></div><div class="choices">${renderChoices('document',docChoices,docChoices[0],1)}</div>`;
 }else if(state.screen==='document-result'){
  updateProgress(86);const ok=state.document==='careful';html=`<p class="eyebrow">${ok?'FUENTE INTERPRETADA':'LECTURA PARA REVISAR'}</p><h1>${ok?'La fuente suma perspectiva.':'La síntesis no vuelve idénticos los casos.'}</h1><div class="${ok?'feedback-positive':'feedback-negative'}"><strong>${ok?'✦ MANÁ +2':'♥ VIDA −1'}</strong><p>${ok?'La CONADEP propone buscar regularidades a partir de numerosos testimonios. Esa síntesis fortalece la comparación, junto con los detalles de cada caso.':'El texto habla de referencias semejantes y convergentes; no afirma que cada operativo fuera idéntico ni reemplaza a quienes declararon.'}</p></div><div class="actions right"><button data-action="continue-compare">CRUZAR LOS TESTIMONIOS ▶</button></div>`;
 }else if(state.screen==='compare'){
  updateProgress(90);const compareChoices=[{id:'strong',text:'Los casos muestran secuestros y traslados desde lugares diversos. La síntesis de CONADEP ayuda a evaluar si algunos rasgos aparecen en más testimonios.'},{id:'same',text:'Los traslados entre distintas dependencias permiten pensar que existía un circuito común en las cuatro ciudades.'},{id:'isolated',text:'Las diferencias de horario, lugar y destino hacen prudente revisar cada caso por separado antes de hablar de conexiones.'}];html=`<p class="eyebrow">CRUCE DE TESTIMONIOS · 4 CIUDADES</p><h1>¿Qué se repite y qué cambia?</h1><div class="compare-list">${scenes.map(s=>`<div class="case-mini"><b>${s.place}</b>${esc(s.clue)}</div>`).join('')}</div><p class="lead">¿Qué conclusión se sostiene mejor con estos datos?</p><div class="choices">${renderChoices('compare',compareChoices,compareChoices[0],2,'LECTURA')}</div>`;
 }else if(state.screen==='compare-result'){
  updateProgress(93);const ok=state.compare==='strong';html=`<p class="eyebrow">${ok?'COINCIDENCIAS CON RESPALDO':'VOLVAMOS A LOS RELATOS'}</p><h1>${ok?'Comparar también es ver las diferencias.':'Revisá el alcance de la conclusión.'}</h1><div class="${ok?'feedback-positive':'feedback-negative'}"><strong>${ok?'✦ MANÁ +1':'♥ VIDA −1'}</strong><p>${ok?'Los cuatro relatos registran espacios y recorridos distintos. La síntesis permite preguntar si algunas regularidades aparecen en otros casos, sin atribuirles una secuencia idéntica.':'Las diferencias entre estos relatos no bastan para descartar conexiones. Tampoco prueban que actuara el mismo grupo en todas las ciudades.'}</p></div><div class="actions right"><button data-action="continue-defense">ESCUCHAR A LA DEFENSA ▶</button></div>`;
 }else if(state.screen==='defense'){
  updateProgress(96);const defenseChoices=[{id:'careful',text:'Comparar qué coincide y qué varía entre las cuatro ciudades, y contrastarlo con la síntesis amplia de la CONADEP.'},{id:'overstate',text:'Concluir que el mismo grupo ejecutó las cuatro detenciones y que todos los centros respondían a una única cadena local.'},{id:'giveup',text:'Usar primero la síntesis general; dejar los detalles de cada testigo para revisar más adelante.'}];html=`<p class="eyebrow">OBJECIÓN DE LA DEFENSA</p><h1>«Son historias aisladas»</h1><div class="mission-box"><strong>RESPONDÉ CON EL EXPEDIENTE</strong><p>¿Qué respuesta combina los testimonios con la fuente de alcance más amplio?</p></div><div class="choices">${renderChoices('defense',defenseChoices,defenseChoices[0],1,'RESPUESTA')}</div><p class="clock-note">Maná disponible: ${state.mana}/5 · Para sostener la respuesta necesitás al menos 3 unidades de evidencia.</p>`;
 }else if(state.screen==='ending'){
  updateProgress(100);const success=state.result==='careful'&&state.mana>=3;const finalSlides=[
   {title:'El fallo · 9 de diciembre de 1985',body:'La Cámara Federal condenó a Jorge Rafael Videla y Emilio Eduardo Massera a prisión perpetua; a Orlando Ramón Agosti a 4 años y 6 meses; a Roberto Viola a 17 años y a Armando Lambruschini a 8 años. Cuatro integrantes de las juntas fueron absueltos.',link:'SENTENCIA DEL JUICIO A LAS JUNTAS',url:'https://www.argentina.gob.ar/noticias/juicio-las-juntas-la-primera-condena-al-terrorismo-de-estado'},
   {title:'La justicia continúa',body:'Después de años de impunidad, se reabrieron los procesos por crímenes de lesa humanidad. Las causas siguen en distintas jurisdicciones; la Procuraduría de Crímenes contra la Humanidad publica información actualizada sobre su estado.',link:'ESTADO ACTUAL DE LAS CAUSAS',url:'https://www.mpf.gob.ar/lesa/50-anos-del-ultimo-golpe-de-estado/'},
   {title:'Las historias y sus fuentes',body:'Los casos del juego están documentados en Nunca Más. Los diálogos se condensaron y adaptaron en primera persona a partir de testimonios reales: no son transcripciones literales ni las personas entrevistadas hablaron con la Fiscalía exactamente como en esta recreación.',link:'ABRIR NUNCA MÁS COMPLETO',url:'Nunca-Mas.pdf#page=1'},
   {title:'',body:'',link:'',url:'',image:'assets/nunca-mas-pixel.png',final:true}
  ];const finalPlate=finalSlides[state.epilogueSlide];const lastEpilogueSlide=finalSlides.length-1;html=`<p class="eyebrow">CIERRE · ${success?'ARGUMENTO SOSTENIDO':'EXPEDIENTE POR FORTALECER'}</p><div class="ending"><h1>${success?'Las coincidencias importan.':'El alegato necesita más respaldo.'}</h1><p>${success?'Los testimonios de Córdoba, Tucumán, Rosario y Mar del Plata muestran detenciones y traslados en distintos lugares. Al cruzarlos con la síntesis de la CONADEP, podés sostener que hay regularidades que investigar, sin afirmar que todos los hechos fueron idénticos.':state.result==='careful'?'Elegiste una respuesta prudente, pero reuniste menos de tres unidades de evidencia. Volvé a valorar las pistas y el cruce para fortalecer el alegato.':'La respuesta excede lo que muestran las pruebas o descarta datos que aún se pueden comparar. Revisá las pistas y la síntesis antes de responder.'}</p><strong>${success?'Expediente breve completado':`Maná ${state.mana}/5 · Vida ${state.life}/3`}</strong><span>CIERRE DEL EXPEDIENTE · NO ES LA SENTENCIA</span></div><p class="source">Base histórica: Nunca Más y CONADEP. Diálogos adaptados para el juego.</p>${state.epilogueDismissed?'<button class="secondary" data-action="show-epilogue">LEER EL CIERRE HISTÓRICO</button>':`<div class="opening-backdrop epilogue-backdrop ${finalPlate.final?'final-ending-backdrop':''}"><section class="opening-modal ${finalPlate.final?'final-ending-modal':''}" role="dialog" aria-modal="true" ${finalPlate.final?'':'aria-labelledby="epilogue-title"'}>${finalPlate.final?`<img class="final-ending-image" src="${finalPlate.image}" alt="Nunca Más en letras rojas pixeladas sobre fondo negro">`:`<p class="eyebrow">CIERRE HISTÓRICO · PLACA ${state.epilogueSlide+1}/${finalSlides.length}</p>${finalPlate.title?`<h2 id="epilogue-title">${finalPlate.title}</h2>`:''}<div class="epilogue-plaque"><p>${finalPlate.body}</p><a href="${finalPlate.url}" target="_blank" rel="noopener">${finalPlate.link} ↗</a></div>`}<div class="actions right"><button class="gold" data-action="epilogue-next">${state.epilogueSlide<lastEpilogueSlide?'SIGUIENTE ▶':'FINALIZAR'}</button></div></section></div>`}<div class="actions"><button class="secondary" data-action="restart">VOLVER A EMPEZAR</button>${success?'':'<button data-action="try-defense">REVISAR EL ALEGATO</button>'}</div>`;
 }
 game.innerHTML=html;
 game.querySelectorAll('[data-question]').forEach(b=>b.addEventListener('click',()=>{state.heard[at]=state.heard[at]||[];state.heard[at][state.turn]=scene.turns[state.turn][Number(b.dataset.question)];state.selected=Number(b.dataset.question);render()}));
 game.querySelectorAll('[data-clue]').forEach(b=>b.addEventListener('click',()=>{state.last=b.dataset.clue;state.screen='clue-result';changeResource(state.last==='careful'?'mana':'life',state.last==='careful'?1:-1,state.last==='careful'?5:3);render()}));
 game.querySelectorAll('[data-document]').forEach(b=>b.addEventListener('click',()=>{state.document=b.dataset.document;state.screen='document-result';const ok=state.document==='careful';changeResource(ok?'mana':'life',ok?2:-1,ok?5:3);render()}));
 game.querySelectorAll('[data-compare]').forEach(b=>b.addEventListener('click',()=>{state.compare=b.dataset.compare;state.screen='compare-result';if(state.compare==='strong')changeResource('mana',1,5);else changeResource('life',-1,3);render()}));
 game.querySelectorAll('[data-defense]').forEach(b=>b.addEventListener('click',()=>{state.result=b.dataset.defense;state.screen='ending';if(state.result==='careful')changeResource('mana',1,5);else changeResource('life',-1,3);render()}));
 game.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>{const action=b.dataset.action;
  if(action==='history-next'){if(state.historySlide<2)state.historySlide++;else state.screen='intro'}
  if(action==='begin'){state.name=game.querySelector('#player-name').value.trim();storageWrite('localStorage','nm-short-player',state.name);state.tutorialRouteDone=false;state.tutorialTalkDone=false;state.screen='travel'}
  if(action==='tutorial-next')state.screen='travel';
  if(action==='arrive')state.screen='arrival';
  if(action==='enter'){state.screen='dialogue';state.turn=0;state.selected=null}
  if(action==='dialogue-next'){state.selected=null;if(state.turn<3)state.turn++;else state.screen='clue'}
  if(action==='clue-next'){if(at<scenes.length-1){state.place++;state.turn=0;state.selected=null;state.screen='travel'}else state.screen='return-travel'}
  if(action==='return-arrive')state.screen='document';
  if(action==='continue-compare')state.screen='compare';
  if(action==='continue-defense')state.screen='defense';
  if(action==='epilogue-next'){if(state.epilogueSlide<3)state.epilogueSlide++;else state.epilogueDismissed=true}
  if(action==='close-epilogue')state.epilogueDismissed=true;
  if(action==='show-epilogue'){state.epilogueDismissed=false;state.epilogueSlide=0}
  if(action==='restart'){restartGame();return}
  if(action==='try-defense')state.screen='defense';
  render();window.scrollTo({top:0,behavior:'smooth'});
 }));
 if(state.screen==='travel'&&!state.tutorialRouteDone&&!liveTutorial)showLiveTutorial('route');
 else if(state.screen==='dialogue'&&state.selected===null&&!state.tutorialTalkDone&&!liveTutorial)showLiveTutorial('talk');
}
render();
</script>
